name: OpenGithubs 中文趋势汇总

on:
  schedule:
    # 每天北京时间 09:00 (UTC 01:00) 生成日榜
    - cron: "0 1 * * *"
    # 每周一北京时间 09:30 (UTC 01:30) 生成周榜
    - cron: "30 1 * * 1"
    # 每月 1 号北京时间 10:00 (UTC 02:00) 生成月榜
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "选择要生成的榜单类型"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - monthly
          - all

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成中文趋势报告
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.qq.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "30 1 * * 1" ]; then
            MODE="weekly"
          elif [ "${{ github.event.schedule }}" = "0 2 1 * *" ]; then
            MODE="monthly"
          else
            MODE="daily"
          fi
          echo "Running mode: $MODE"
          python scripts/digest.py --mode "$MODE"

      - name: 提交并推送报告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ cache/ README.md
          if git diff --staged --quiet; then
            echo "没有新内容需要提交"
          else
            git commit -m "chore: update OpenGithubs CN digest ($(date -u +'%Y-%m-%d'))"
            git push
          fi
